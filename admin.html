<!doctype html>
<html>
<head>
    <title>Reverse Proxy</title>
    <style>
        body {
            background-color: white;
            color: black;
            font-family: monospace;
        }
        
        .bordered {
            width: 95vw;
            min-height: 50px;
            border-radius: 5;
            border-color: lightgray;
            border-style: double;
            border-width: 1px;
            padding: 0 10px;
            margin-bottom: 15px;
            margin-left: .5vw;
        }


        .bordered_half {
            display: inline-block;
            width: 45.69vw;
            min-height: 50px;
            padding: 0;
            border-radius: 5;
            border-color: lightgray;
            border-style: double;
            border-width: 1px;
            padding: 0 10px;
            margin-bottom: 15px;
            margin-left: .5vw;
        }

        table {
            border-collapse: collapse;
            
        }

        td,th {
            border: 1px solid;
            min-width: 120px;;
        }

        .flagged td {
            background-color: rgb(255, 207, 207);
        }
    </style>
    <script>
        var base_url = document.URL.split("reverse_proxy")[0] + "reverse_proxy/";
        
        //timestamp    date,ip,method,path,flagged,reason
        data = []
        blacklist = []
        specialEndpoints = []
        detectionEndpoints = []
        max_rows = 25

        function searchActivity() {
            table = `<tr>
                <th>Date</th>
                <th>IP Address</th>
                <th>Request Method</th>
                <th>Request Path</th>
                <th>Flagged</th>
                <th>Reason</th>
            </tr>\n`;

            count = 0;

            for (d in data) {
                //console.log(d)
                l = data[d].split(",")
                //console.log(l)
                flagged = ""

                if (((l[5] != "0" && document.getElementById("filterflagged")) || !document.getElementById("filterflagged").checked) && data[d].includes(document.getElementById("searchbox").value)){ 
                    if (l[5] != "0") {
                        flagged = " class='flagged'"
                        if (l[5] == "2") {
                            l[5] = "Violation"
                        } else {
                        l[5] = "Blocked"
                        }
                    } else {
                        l[5] = ""
                    }
                    table = table + `<tr` + flagged + `>
                        <td>` + l[1] + `</td>
                        <td>` + l[2] + `</td>
                        <td>` + l[3] + `</td>
                        <td>` + l[4] + `</td>
                        <td>` + l[5] + `</td>
                        <td>` + l[6] + `</td>
                        </tr>\n`
                    count += 1;
                }

                if (count >= max_rows) break
            }

            document.getElementById("activityTable").innerHTML = table;
        }

        function searchEndpoints() {
            table = `<tr>
                <th>Path</th>
            </tr>\n`;

            count = 0;

            for (d in specialEndpoints) {
                table = table + "<tr> <td> " + specialEndpoints[d] + "</td> </tr>\n"
            }

            document.getElementById("endpointsTable").innerHTML = table;
        }

        function searchBlacklist() {
            table = `<tr>
                <th>IP Address</th>
            </tr>\n`;

            count = 0;

            for (d in blacklist) {
                table = table + "<tr> <td> " + blacklist[d] + "</td> </tr>\n"
            }

            document.getElementById("endpointsTable").innerHTML = table;
        }

        function searchDetected() {
            table = `<tr>
                <th>Endpoint</th>
                <th>Index</th>
            </tr>\n`;

            count = 0;

            for (d in detectionEndpoints) {
                l = detectionEndpoints[d].split(",")
                table = table + "<tr> <td> " + l[0] + "</td> <tr> <td> " + l[1] + "</td>  </tr>\n"
            }

            document.getElementById("endpointsTable").innerHTML = table;
        }

        function refreshTraffic() {
            var json = new XMLHttpRequest();
            json.open("GET", base_url + "get_data");
            //json.setRequestHeader('Authorization', auth_key);
            json.send();
            
            json.onreadystatechange = function(ddata) {
                data = json.responseText.split("\n");
                data.pop()
                data.reverse()
                data.pop()
                //console.log(data);
                //document.getElementById("searchterm").value = "";
                searchActivity();
            }
        }

        function refreshEndpoints() {
            var json = new XMLHttpRequest();
            json.open("GET", base_url + "get_special_endpoints");
            //json.setRequestHeader('Authorization', auth_key);
            json.send();
            
            json.onreadystatechange = function(ddata) {
                specialEndpoints = json.responseText.split("\n");
                specialEndpoints.pop()
                specialEndpoints.reverse()
                specialEndpoints.pop()
                //console.log(data);
                //document.getElementById("searchterm").value = "";
                searchEndpoints();
            }
        }

        function addEndpoint() {
            if (document.getElementById("endpointbox").value.length > 1) {
                var json = new XMLHttpRequest();
                json.open("GET", base_url + "add_special_endpoint?endpoint=" + document.getElementById("endpointbox").value);
                //json.setRequestHeader('Authorization', auth_key);
                json.send();
                document.getElementById("endpointbox").value = "";
                
                json.onreadystatechange = function(ddata) {
                    refreshEndpoints();
                }
            }
        }

        function refreshBlacklist() {
            var json = new XMLHttpRequest();
            json.open("GET", base_url + "get_blacklist");
            //json.setRequestHeader('Authorization', auth_key);
            json.send();
            
            json.onreadystatechange = function(ddata) {
                blacklist = json.responseText.split("\n");
                blacklist.pop()
                blacklist.reverse()
                blacklist.pop()
                //console.log(data);
                //document.getElementById("searchterm").value = "";
                searchBlacklist();
            }
        }

        function refreshDetected() {
            var json = new XMLHttpRequest();
            json.open("GET", base_url + "get_detected_endpoints");
            //json.setRequestHeader('Authorization', auth_key);
            json.send();
            
            json.onreadystatechange = function(ddata) {
                detectionEndpoints = json.responseText.split("\n");
                detectionEndpoints.pop()
                detectionEndpoints.reverse()
                detectionEndpoints.pop()
                //console.log(data);
                //document.getElementById("searchterm").value = "";
                searchDetected();
            }
        }
        
        window.onload = function() {
            refreshTraffic();
            refreshEndpoints();
            refreshTraffic();
        }
    </script>
</head>
<body>
    <center><h1>Reverse Proxy Administration</h1></center>
    <div class="bordered">
        <center><h2>Recent Activity</h2></center>
        <button onclick="searchActivity()">Search</button>
        <label>Filter: </label><input type="text" id="searchbox">
        <label>Only Show Flagged: </label><input type="checkbox" id="filterflagged">
        <table id="activityTable">
            <tr>
                <th>Date</th>
                <th>IP Address</th>
                <th>Request Path</th>
                <th>Request Method</th>
                <th>Flagged</th>
                <th>Reason</th>
            </tr>
            
        </table>
    </div>
    <div class="bordered_half">
        <center><h2>Flagged Endpoints</h2></center>
        <label>New Endpoint: </label><input type="text" id="endpointbox">
        <button onclick="addEndpoint()">Add Endpoint:</button>
        <table id = "endpointsTable">
            <tr>
                <th>Path</th>
            </tr>
        </table>
    </div>
    <div class="bordered_half">
        <center><h2>Blacklisted Addresses</h2></center>
        <table id = "endpointsTable">
            <tr>
                <th>IP Address</th>
            </tr>
        </table>
    </div>
    <div class="bordered">
        <center><h2>AI Detected Endpoints</h2></center>
        <button onclick="addDetectionEndpoint()">Add Detected Endpoint</button>
        <label>Endpoint: </label><input type="text" id="endpointbox2">
        <label>Payload index </label><input type="text" id="indexbox">
        <table id="activityTable">
            <tr>
                <th>Endpoint</th>
                <th>Index</th>
            </tr>
        </table>
    </div>
</body>
</html>
